<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed - Preview</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* Responsive styling for when screen is below 600px */
    @media only screen and (max-width: 600px) {
      .title-text {
        font-size: 4vw !important;
        margin-bottom: 1vw !important;
      }

      .sub-text {
        font-size: 2.5vw !important;
        margin-bottom: 2vw !important;
      }

      .order-box {
        padding: 2vw !important;
        margin-bottom: 2vw !important;
      }

      .order-label {
        font-size: 2vw !important;
      }

      .order-val {
        font-size: 3vw !important;
      }

      .ticket-box {
        padding: 2vw !important;
        margin-bottom: 2vw !important;
      }

      .ticket-title {
        font-size: 2.8vw !important;
      }

      .badge {
        font-size: 2vw !important;
        padding: 0.5vw 1vw !important;
      }

      .subtotal {
        font-size: 2vw !important;
      }

      .btn {
        padding: 1.5vw 3vw !important;
        font-size: 2.5vw !important;
      }
    }
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #0088cc; font-family: 'Outfit', 'Inter', Arial, sans-serif;">

  <table width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color: #0088cc;">
    <tr>
      <td align="center" valign="top" style="padding: 20px 0;">

        <!-- Main Container: Fixed Layout so content doesn't break percentages -->
        <table border="0" cellpadding="0" cellspacing="0" background="/email-bg.jpg"
          style="table-layout: fixed; background-image: url('/email-bg.jpg'); background-size: 100% auto; background-position: top center; background-repeat: no-repeat; width: 100%; max-width: 600px; margin: 0 auto; aspect-ratio: 9/16; background-color: #12040c;">

          <tr>
            <!-- Using a single cell with percentage padding to place the content perfectly over the phone screen on the right side -->
            <td valign="top"
              style="padding-top: 27%; padding-left: 58%; padding-right: 10%; padding-bottom: 10%; width: 100%; box-sizing: border-box;">

              <!-- Content Wrapper with Tilt -->
              <div
                style="color: #ffffff; text-align: left; background-color: transparent; transform: rotate(5.5deg); transform-origin: top left; width: 100%; word-wrap: break-word;">

                <h2 class="title-text" style="margin: 0 0 6px 0; font-size: 18px; font-weight: 800; color: #4ade80;">
                  Booking Confirmed!
                </h2>
                <p class="sub-text" style="margin: 0 0 10px 0; color: #e4e4e7; font-size: 11px; line-height: 1.4;">
                  Hi <strong>Bhaviraj</strong>, your tickets are secured!
                </p>

                <!-- Order Summary -->
                <div class="order-box"
                  style="background-color: rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 10px; margin-bottom: 12px; border-left: 3px solid #fbbf24;">
                  <p class="order-label"
                    style="margin: 0 0 4px 0; font-size: 9px; color: #a1a1aa; text-transform: uppercase;">Order ID</p>
                  <p class="order-val"
                    style="margin: 0 0 8px 0; font-size: 11px; font-weight: bold; font-family: monospace;">ORD-987654321
                  </p>

                  <p class="order-label"
                    style="margin: 0 0 4px 0; font-size: 9px; color: #a1a1aa; text-transform: uppercase;">Amount Paid
                  </p>
                  <p class="order-val" style="margin: 0; font-size: 12px; font-weight: bold; color: #fbbf24;">₹300.00
                  </p>
                </div>

                <!-- Tickets -->
                <div style="margin-bottom: 10px;">
                  <p class="order-label"
                    style="margin: 0 0 6px 0; font-size: 9px; font-weight: bold; color: #ffffff; text-transform: uppercase;">
                    Your Tickets</p>

                  <div class="ticket-box"
                    style="background-color: rgba(0,0,0,0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px; margin-bottom: 8px;">
                    <h3 class="ticket-title"
                      style="margin: 0 0 4px 0; color: #ffffff; font-size: 12px; font-weight: bold;">Kuber Ka Khajana
                    </h3>
                    <p class="ticket-date" style="margin: 0 0 6px 0; color: #a1a1aa; font-size: 9px;">
                      18/06/2026 • 08:00 PM
                    </p>
                    <div style="margin-bottom: 6px;">
                      <span class="badge"
                        style="display: inline-block; background-color: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4); color: #fbbf24; border-radius: 4px; padding: 2px 6px; margin: 0 3px 3px 0; font-family: monospace; font-size: 10px; font-weight: bold;">A-12345</span>
                      <span class="badge"
                        style="display: inline-block; background-color: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4); color: #fbbf24; border-radius: 4px; padding: 2px 6px; margin: 0 3px 3px 0; font-family: monospace; font-size: 10px; font-weight: bold;">A-67890</span>
                    </div>
                    <div class="subtotal"
                      style="border-top: 1px dashed rgba(255, 255, 255, 0.15); padding-top: 6px; font-size: 9px; color: #a1a1aa;">
                      ₹150 x 2 = <strong style="color:#fff;">₹300.00</strong>
                    </div>
                  </div>

                </div>

                <!-- CTA -->
                <div style="text-align: center; margin-top: 12px;">
                  <a href="https://bookmysubhlaxmi.com/my-tickets" class="btn"
                    style="display: inline-block; background-color: #fbbf24; color: #000000; font-weight: bold; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                    View Tickets
                  </a>
                </div>

              </div>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>

</html>
